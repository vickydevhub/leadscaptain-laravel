name: Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  tests:
    name: PHP 8.4 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql, pcntl, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Run Pint
        run: composer lint

      - name: Run PHPStan
        run: composer analyse